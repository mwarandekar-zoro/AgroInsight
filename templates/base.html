<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AgroInsight AI{% endblock %}</title>
  <meta name="description" content="Smart Agriculture Analytics & Recommendation Platform">
  <script>
    // Runs before paint so there's no flash of the wrong theme.
    (function () {
      try {
        if (localStorage.getItem('agroinsight-theme') === 'light') {
          document.documentElement.classList.add('light-theme');
        }
      } catch (e) { /* localStorage unavailable — default to dark */ }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
